[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
  ".git",
  ".venv",
  "venv",
  "__pycache__",
  "build",
  "dist",
]

[tool.ruff.lint]
select = [
  "E",
  "F",
  "I",
  "UP",
  "B",
  "DTZ",
]
ignore = [
  "E501",
  "B008"
]

[tool.ruff.lint.per-file-ignores]
# Test fixtures legitimately construct naive datetime literals (the UTCDateTime
# column type bind-normalizes them to UTC on write), and two #130 tests pass
# naive input on purpose to exercise the naive→UTC guard. Every other DTZ rule
# (utcnow, bare now(), naive strptime, date.today) stays active on tests; only
# the naive-constructor rule is relaxed here. Production code stays DTZ-strict.
"tests/*" = ["DTZ001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
  # Pre-existing app tech debt (datetime.utcnow(), FastAPI on_event) — warnings,
  # not failures, and they predate this suite. Silenced to keep `pytest` output
  # readable; flagged for a separate cleanup before the next Python/dep upgrade.
  "ignore::DeprecationWarning",
]

[tool.vulture]
min_confidence = 80
paths = ["app", "main.py"]
ignore_decorators = ["@app.*", "@router.*", "@*.get", "@*.post", "@*.put", "@*.delete"]

[tool.deptry]
ignore = []
# deckbooks/ is the local Deckbook prototype; its tests use pytest (a dev dep),
# but deptry only auto-detects the top-level tests/ as a test dir, so it flags
# the prototype's test file as prod code. Exclude just that dir.
extend_exclude = ["deckbooks/tests"]

[tool.deptry.per_rule_ignores]
DEP002 = ["uvicorn", "jinja2", "python-multipart", "itsdangerous", "psycopg"]
DEP003 = ["urllib3"]
