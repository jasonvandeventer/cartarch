name: Build and publish dev image

# Dev image stream for the cartarch-dev environment (vanfreckle-platform Phase B).
# Every push to main builds a mutable `:main` tag (what the dev image-updater tracks
# by digest) plus an immutable `:main-<sha7>` tag for traceability / rollback pinning.
#
# Shares the PostgreSQL, browser, migration and built-image gates with releases.

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cartarch

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
    with:
      app-version: main-${{ github.sha }}

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - verify

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Mutable `main` (dev image-updater tracks its digest) + immutable
          # `main-<sha7>` (traceability / rollback pinning).
          tags: |
            type=raw,value=main
            type=sha,prefix=main-,format=short

      - name: Download the verified image
        uses: actions/download-artifact@v4
        with:
          name: verified-image
          path: /tmp/verified-image

      - name: Publish the exact image that passed verification
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          docker load -i /tmp/verified-image/cartarch-verified.tar.gz
          while IFS= read -r tag; do
            docker tag cartarch-verified:build "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
