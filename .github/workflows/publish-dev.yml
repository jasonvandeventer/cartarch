name: Build and publish dev image

# Dev image stream for the cartarch-dev environment (vanfreckle-platform Phase B).
# Every push to main builds a mutable `:main` tag (what the dev image-updater tracks
# by digest) plus an immutable `:main-<sha7>` tag for traceability / rollback pinning.
#
# Gates on lint + test (mirrors publish.yml's tag path) so dev never runs an image
# that failed the same checks prod's tag build enforces. Separate file from
# publish.yml on purpose: this is main-triggered, publish.yml is tag-triggered, and
# keeping the trigger semantics unmixed avoids a shared-workflow tangle. Cost: one
# more lint+test run per main push on top of ci.yml — consolidation via workflow_call
# is the Phase C "CI trigger cleanup" item, not this file.

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cartarch

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          DEV_MODE: "true"
        run: pytest tests/

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Mutable `main` (dev image-updater tracks its digest) + immutable
          # `main-<sha7>` (traceability / rollback pinning).
          tags: |
            type=raw,value=main
            type=sha,prefix=main-,format=short

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=main-${{ github.sha }}
