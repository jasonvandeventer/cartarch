name: Build and publish image

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/cartarch

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Ruff
        run: ruff check .

      - name: Run Ruff format check
        run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run unit tests
        env:
          DEV_MODE: "true"
        run: pytest tests/

  release-record-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Assert chronicle.json and README carry the tag version
        run: |
          python3 - <<'EOF'
          import json, os, sys
          if os.environ.get("GITHUB_REF_TYPE") != "tag":
              print("not a tag build — skipping release-record check")
              sys.exit(0)
          tag = os.environ["GITHUB_REF_NAME"]        # vX.Y.Z
          version = tag.lstrip("v")                  # chronicle stores bare versions
          data = json.load(open("app/data/chronicle.json"))
          latest = data[0]["version"].lstrip("v")    # newest-first; mirrors app/main.py boot guard
          if latest != version:
              sys.exit(f"chronicle.json newest entry is {latest}, tag is {tag}")
          readme = open("README.md").read()
          if tag not in readme:                      # README format: 'Current version: vX.Y.Z'
              sys.exit(f"README.md does not mention {tag}")
          print(f"release records OK for {tag}")
          EOF

  build-and-push:
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - release-record-guard

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set image tag
        id: tag
        run: echo "image_tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.tag.outputs.image_tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.tag.outputs.image_tag }}

  # ===========================================================================
  # Post-ship reporting (Sprint 5, Component 1). Downstream of build-and-push,
  # so it fires only AFTER the image publishes — and never for a release that
  # didn't. It REPORTS a release a human already tagged/built/deployed: Discord
  # patch notes, a GitHub Release (the repo's changelog record), and issue
  # close/flag. It never tags, builds, deploys, or decides anything about the
  # ship. All summaries are deterministic (reviewed chronicle entry or commit
  # log) — no LLM writes any durable record here.
  #
  # The `ac-verified` label gate (issue step below):
  #   `ac-verified` means "a human confirmed this issue's acceptance criteria
  #   match what actually shipped." It is applied ONLY AFTER the fix is
  #   verified — never at triage or creation. Auto-close depends entirely on
  #   the label meaning exactly that: an issue whose ACs describe the wrong
  #   thing (e.g. a mechanism that was never the bug) must NOT carry it, so it
  #   gets flagged for human review instead of closed against stale criteria.
  #   See docs/labels.md.
  # ===========================================================================
  post-ship:
    runs-on: ubuntu-latest
    needs: build-and-push          # downstream → runs only after image publish
    permissions:
      contents: write              # create the GitHub Release (changelog record)
      issues: write                # close / comment on referenced issues

    steps:
      - name: Check out repo (full history + tags)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0           # need previous tag, commit range, and diff stat

      - name: Gather release facts (deterministic — no AI)
        id: facts
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          # Previous release tag = newest tag reachable from this tag's parent.
          PREV_TAG="$(git describe --tags --abbrev=0 "${VERSION}^" 2>/dev/null || true)"
          RANGE="${PREV_TAG:+${PREV_TAG}..}${VERSION}"
          echo "version=${VERSION}"   >> "$GITHUB_OUTPUT"
          echo "prev_tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          # Real diff numbers, quoted verbatim in the issue comment (no prose).
          DIFFSTAT="$(git diff --shortstat ${PREV_TAG:+${PREV_TAG}..}${VERSION} | sed 's/^ *//')"
          echo "diffstat=${DIFFSTAT:-no file changes}" >> "$GITHUB_OUTPUT"
          # Referenced issues: #N from commit subjects+bodies in range, unique.
          git log --format='%s%n%b' ${RANGE} \
            | grep -oiE '#[0-9]+' | tr -d '#' | sort -un > issues.txt || true
          # Commit subjects: the fallback changelog source.
          git log --format='- %s' ${RANGE} > commits.txt
          echo "issues: $(paste -sd, issues.txt || true)"

      - name: Build release notes (reviewed chronicle entry, else commit log)
        run: |
          set -euo pipefail
          python3 - "${{ steps.facts.outputs.version }}" <<'PY'
          import json, pathlib, sys
          version = sys.argv[1].lstrip("v")
          entry = None
          try:
              data = json.loads(pathlib.Path("app/data/chronicle.json").read_text())
              entry = next((e for e in data if e.get("version") == version), None)
          except Exception:
              pass
          lines = []
          if entry:                       # prefer the human-reviewed changelog entry
              for label, key in (("Added", "added"), ("Refined", "refined"), ("Resolved", "resolved")):
                  items = entry.get(key) or []
                  if items:
                      lines.append(f"**{label}**")
                      lines += [f"- {i}" for i in items]
              if entry.get("archivist_note"):
                  lines += ["", entry["archivist_note"]]
              source = "chronicle.json (reviewed)"
          else:                           # deterministic fallback: commit log, no LLM
              lines = pathlib.Path("commits.txt").read_text().strip().splitlines()
              source = "commit log (no reviewed chronicle entry for this version)"
          notes = "\n".join(lines).strip() or "(no notes)"
          pathlib.Path("release_notes.md").write_text(notes + "\n")
          summary = next((l.lstrip("- ").strip() for l in lines
                          if l and not l.startswith("**")), notes.splitlines()[0])
          pathlib.Path("discord_summary.txt").write_text(summary)
          print(f"::notice::release-notes source = {source}")
          PY

      - name: Discord patch notes (best-effort — never blocks the rest)
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "::warning::DISCORD_WEBHOOK_URL secret not set — skipping Discord post"
            exit 0
          fi
          VERSION="${{ steps.facts.outputs.version }}"
          CONTENT="$(printf '**Cartarch %s shipped**\n%s' "${VERSION}" "$(cat discord_summary.txt)")"
          jq -n --arg c "${CONTENT}" '{content: $c}' > discord_payload.json
          curl -sS -X POST -H "Content-Type: application/json" \
               -d @discord_payload.json "${DISCORD_WEBHOOK_URL}" \
            && echo "Discord posted" || echo "::warning::Discord POST failed"

      - name: Publish GitHub Release notes (repo changelog record — idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.facts.outputs.version }}"
          if gh release view "${VERSION}" >/dev/null 2>&1; then
            gh release edit   "${VERSION}" --notes-file release_notes.md
          else
            gh release create "${VERSION}" --verify-tag --title "${VERSION}" --notes-file release_notes.md
          fi

      - name: Close or FLAG referenced issues (AC-gated — idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.facts.outputs.version }}"
          DIFFSTAT="${{ steps.facts.outputs.diffstat }}"
          # Per-version hidden marker so a re-run/retry never double-flags an issue.
          MARKER="<!-- post-ship:flag:${VERSION} -->"
          [ -s issues.txt ] || { echo "no referenced issues"; exit 0; }
          while read -r N; do
            [ -n "$N" ] || continue
            # Skip PR numbers. Issues and PRs share one number space, so a
            # release commit that cites a PR (e.g. "Phase 2 (#90)") lands here;
            # `gh issue view <pr>` behaves inconsistently under `set -e` (some
            # versions return a state that then falls through to a later
            # hard-failing `gh issue view --json labels`). This automation is
            # issue-only — `gh pr view` succeeds ONLY for a real PR.
            if gh pr view "$N" --json number >/dev/null 2>&1; then
              echo "#$N is a pull request — skipping"; continue
            fi
            state="$(gh issue view "$N" --json state --jq .state 2>/dev/null || echo MISSING)"
            case "$state" in
              MISSING) echo "::warning::#$N referenced but not found — skipping"; continue ;;
              CLOSED)  echo "#$N already closed — skipping"; continue ;;
            esac
            # AC gate: only auto-close an issue a human marked `ac-verified`
            # (acceptance criteria confirmed to match what actually shipped).
            if gh issue view "$N" --json labels --jq '.labels[].name' | grep -Fxq 'ac-verified'; then
              gh issue close "$N" --reason completed \
                --comment "Shipped in **${VERSION}**. Verified change: ${DIFFSTAT}. (Auto-closed by post-ship automation — issue carried the \`ac-verified\` label.)"
              echo "closed #$N"
              continue
            fi
            # Not verified → flag, don't close. Idempotent: skip if already flagged
            # for this version, and only add the label if it isn't already present.
            if gh issue view "$N" --json comments --jq '.comments[].body' | grep -Fq "${MARKER}"; then
              echo "#$N already flagged for ${VERSION} — skipping comment"
            else
              BODY="$(printf '%s\nReferenced by release **%s** (change: %s) but **not auto-closed**: this issue is not labeled `ac-verified`, so its acceptance criteria have not been confirmed to match the shipped change. Review the criteria against what shipped, then close manually. (Sprint-5 guard against phantom-fix closes — cf. #66.)' "${MARKER}" "${VERSION}" "${DIFFSTAT}")"
              gh issue comment "$N" --body "${BODY}"
              echo "flagged #$N"
            fi
            if gh issue view "$N" --json labels --jq '.labels[].name' | grep -Fxq 'needs-ac-review'; then
              echo "#$N already has needs-ac-review — skipping label"
            else
              gh issue edit "$N" --add-label needs-ac-review >/dev/null 2>&1 \
                || echo "::warning::could not add needs-ac-review to #$N (does the label exist?)"
            fi
          done < issues.txt

  # ===========================================================================
  # Deploy verification (Phase D v1, item 2). DETECTION ONLY — no cluster
  # credentials; it polls the PUBLIC URL and a human undoes a bad release (see
  # docs/runbooks/release-retraction.md in the platform repo). Downstream of
  # post-ship so it fires only for a release whose image published, but its `if`
  # runs it even when post-ship's best-effort (Discord) step soft-failed, and
  # even if post-ship hard-failed on a reporting step — a reporting hiccup must
  # not blind deploy verification. It never retroactively affects those
  # release/close steps (jobs are independent; they already succeeded upstream).
  # The job's OWN exit status reflects verification TRUTH: red = NOT confirmed
  # live, even though the Discord post itself is best-effort like post-ship's.
  # ===========================================================================
  verify-deploy:
    runs-on: ubuntu-latest
    needs: post-ship
    # Run whenever post-ship actually ran (success OR a reporting-step failure);
    # skip only if it was skipped (build/publish never happened) or cancelled.
    if: ${{ !cancelled() && needs.post-ship.result != 'skipped' }}
    steps:
      - name: Poll /version, soak, alert (exit status = verification truth)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          set -uo pipefail   # deliberately NOT -e: failures are handled so we
                             # control the exit code and always fire the alert.
          URL="https://cartarch.com/version"
          LOGIN="https://cartarch.com/login"
          EXPECTED="${GITHUB_REF_NAME}"          # vX.Y.Z
          ENTRY="${EXPECTED##*.}"                # patch == login footer "Entry N"
          RETRACTION_DOC="vanfreckle-platform/docs/runbooks/release-retraction.md"
          DEADLINE=$(( $(date +%s) + 15*60 ))    # phase-1 budget from job start
          MODE="PRIMARY"
          LIVE=""
          ALERT="⚠ ${EXPECTED} NOT CONFIRMED live after 15m — an OLDER version is still serving or the endpoint is unreachable; check ArgoCD/updater; retraction runbook: ${RETRACTION_DOC}"

          # semver-ish compare: 0 when $1 >= $2. `sort -V` so 4.15.10 beats
          # 4.15.9 — a lexical compare would call the newer one older and pass a
          # genuinely stalled deploy.
          ver_ge() {
            [ "$1" = "$2" ] && return 0
            [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -1)" = "$1" ]
          }

          # Best-effort Discord — same posture as post-ship: never fails the job,
          # so the job's exit code stays a pure verification signal.
          discord() {
            if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
              echo "::warning::DISCORD_WEBHOOK_URL not set — skipping Discord post"
              return 0
            fi
            jq -n --arg c "$1" '{content: $c}' \
              | curl -sS -m 15 -X POST -H 'Content-Type: application/json' -d @- "${DISCORD_WEBHOOK_URL}" \
              && echo "Discord posted" || echo "::warning::Discord POST failed"
          }

          # One probe. Returns 0 on pass; sets $MODE to PRIMARY, or to
          # BOOTSTRAP-FALLBACK when an image predating /version (404) is confirmed
          # via the login footer's "Entry N" (N = patch), the same chronicle-
          # derived number /version reports.
          check() {
            local out code ver
            out=$(curl -sS -m 10 -w $'\n%{http_code}' "$URL" 2>/dev/null) || return 1
            code="${out##*$'\n'}"; out="${out%$'\n'*}"
            if [ "$code" = "200" ]; then
              ver=$(printf '%s' "$out" | jq -r '.version // empty' 2>/dev/null || true)
              [ -z "$ver" ] && return 1
              [ "$ver" = "$EXPECTED" ] && { MODE="PRIMARY"; LIVE="$ver"; return 0; }
              # SUPERSEDED: a NEWER version is serving, so this tag's commits are
              # live inside it — the image updater installs the highest semver, so
              # two tags pushed close together always leave the lower one in this
              # state. That is a successful deploy, not a stalled one; treating it
              # as a failure fired an alert indistinguishable from a real stall
              # (v4.15.1 and v4.15.3, 2026-08-22). An OLDER version still falls
              # through to the failure path, which is the check that matters.
              if ver_ge "${ver#v}" "${EXPECTED#v}"; then
                MODE="SUPERSEDED"; LIVE="$ver"; return 0
              fi
              return 1
            fi
            if [ "$code" = "404" ] \
               && curl -sS -m 10 "$LOGIN" 2>/dev/null | grep -qE "Entry ${ENTRY}([^0-9]|$)"; then
              MODE="BOOTSTRAP-FALLBACK"; return 0
            fi
            return 1
          }

          # Phase 1: version must flip to EXPECTED within 15 min (poll every 30s).
          echo "Phase 1: waiting up to 15 min for ${URL} to reach ${EXPECTED} (or newer)"
          until check; do
            if [ "$(date +%s)" -ge "$DEADLINE" ]; then
              echo "::error::${EXPECTED} did not go live within 15 min"
              discord "${ALERT}"
              exit 1
            fi
            sleep 30
          done
          echo "Phase 1 passed via ${MODE}."

          # Phase 2: soak — 3 consecutive passes, 60s apart (HTTP 200 + expected
          # version, or the same bootstrap check). Any miss = not confirmed stable.
          echo "Phase 2: soak (3 checks, 60s apart)"
          for i in 1 2 3; do
            sleep 60
            if check; then
              echo "soak ${i}/3 ok (${MODE})"
            else
              echo "::error::soak check ${i} failed — deploy flipped but is not holding"
              discord "${ALERT}"
              exit 1
            fi
          done

          SUFFIX=""
          [ "${MODE}" = "BOOTSTRAP-FALLBACK" ] && SUFFIX=" (BOOTSTRAP-FALLBACK: verified via /login Entry ${ENTRY}, /version 404)"
          if [ "${MODE}" = "SUPERSEDED" ]; then
            # Say what actually happened. "${EXPECTED} deployed and verified
            # live" would be false — ${LIVE} is what is serving, and this tag's
            # work is in it.
            echo "VERIFIED: ${EXPECTED} superseded by ${LIVE}, which is live and stable"
            discord "✓ ${EXPECTED} is live inside ${LIVE} (superseded before it deployed on its own — expected when two tags are pushed together)"
          else
            echo "VERIFIED: ${EXPECTED} live and stable via ${MODE}"
            discord "✓ ${EXPECTED} deployed and verified live${SUFFIX}"
          fi
